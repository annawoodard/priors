[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "priors"
version = "0.1.0"
description = "An agent-maintained literature library in plain markdown"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyyaml"]

[project.scripts]
priors = "priors.cli:main"

[tool.setuptools]
packages = ["priors"]
